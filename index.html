<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>bitsurf.cloud</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 72 72'><text y='60' font-size='60'>🌊</text></svg>">
    <meta name="description" content="Catch the blockchain wave. Bitcoin Surf Beach is coming soon.">
    <style>
        html {
            box-sizing: border-box;
        }
        *, *:before, *:after {
            box-sizing: inherit;
        }
        body {
            margin: 0;
            padding: 0;
            background: #42aaf5;
            font-family: 'Press Start 2P', cursive;
            color: white;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        h1 {
            margin-top: 1em;
            font-size: 2.2em;
            text-shadow: 2px 2px #333;
            word-break: break-word;
        }
        h2 {
            margin-top: 0.5em;
            font-size: 1.1em;
            text-shadow: 1px 1px #333;
            word-break: break-word;
        }
        .cover-photo {
            margin: 2em auto 1.5em;
            width: 95vw;
            max-width: 700px;
            border: 4px solid white;
            box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            height: auto;
            display: block;
        }
        .cta {
            margin-bottom: 2em;
            padding: 16px 28px;
            font-size: 1.2em;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid white;
            border-radius: 8px;
            text-decoration: none;
            color: white;
            display: inline-block;
            transition: background 0.2s;
            touch-action: manipulation;
        }
        .cta:hover, .cta:focus {
            background: rgba(255, 255, 255, 0.2);
        }
        @media (max-width: 600px) {
            body {
                padding: 0 2vw;
            }
            h1 {
                font-size: 1.2em;
                margin-top: 0.8em;
            }
            h2 {
                font-size: 0.85em;
            }
            .cover-photo {
                margin: 1.2em auto 1em;
                width: 98vw;
                max-width: 98vw;
                border-width: 2px;
            }
            .cta {
                font-size: 1em;
                padding: 14px 16px;
                border-radius: 7px;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>

<body>
    <h1>bitsurf.cloud</h1>
    <h2>Surfin' on a blockchain</h2>

    <img src="images/concept_cover.png" alt="Bitcoin Surf Beach Concept" class="cover-photo">

    <a class="cta" href="#">Coming soon 🌊</a>
</body>

</html>
