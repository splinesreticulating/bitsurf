<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>bitsurf</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 72 72'><text y='60' font-size='60'>🌊</text></svg>">
    <meta name="description" content="bitsurf">
    <style>
        html {
            box-sizing: border-box;
        }

        *,
        *:before,
        *:after {
            box-sizing: inherit;
        }

        body {
            margin: 0;
            padding: 0;
            background: #42aaf5;
            font-family: 'Press Start 2P', cursive;
            color: white;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 {
            margin-top: 1em;
            font-size: 2.2em;
            text-shadow: 2px 2px #333;
            word-break: break-word;
        }

        .cover-photo {
            margin: 2em auto 1.5em;
            width: 95vw;
            max-width: 700px;
            border: 4px solid white;
            box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            height: auto;
            display: block;
        }

        @media (max-width: 600px) {
            body {
                padding: 0 2vw;
            }

            h1 {
                font-size: 1.2em;
                margin-top: 0.8em;
            }

            .cover-photo {
                margin: 1.2em auto 1em;
                width: 98vw;
                max-width: 98vw;
                border-width: 2px;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>

<body>
    <h1>bitsurf</h1>
    <img src="images/concept_cover.png" alt="Bitcoin Surf Beach Concept" class="cover-photo">
</body>
</html>]
